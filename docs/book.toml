[book]
title = "Dystrail Game Guide"
authors = ["Dystrail Team"]
language = "en"
src = "src"

[preprocessor.shared-help]
command = "python3 ../help/build.py preprocess"

[output.html]
default-theme = "navy"
site-url = "/docs/"
git-repository-url = "https://github.com/VannaDii/Dystrail"
preferred-dark-theme = "navy"
additional-css = ["theme/game-guide.css"]
additional-js = ["theme/game-guide.js"]

[output.html.print]
enable = false
