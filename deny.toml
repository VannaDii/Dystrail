[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[advisories]
ignore = [
    "RUSTSEC-2024-0370",  # SUPPLY-002; exact versions and expiry checked before audit
    "RUSTSEC-2025-0141",  # SUPPLY-001; exact versions and expiry checked before audit
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
