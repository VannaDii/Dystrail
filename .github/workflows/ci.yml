name: CI

on:
  push:
    branches: ["main", "release/complete-game-source-*"]
    paths-ignore: ["docs/**", "README.md", "progress.md"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Cargo clippy (pedantic)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -W clippy::pedantic

      - name: Wasm clippy (pedantic)
        run: cargo clippy -p dystrail-web --target wasm32-unknown-unknown --all-features --locked -- -D warnings -W clippy::pedantic

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Install Chrome and its matching driver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Cargo test (workspace)
        run: cargo test --workspace --all-features -- --nocapture

      - name: Select the Chrome installed with the driver
        env:
          TEST_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ runner.temp }}/dystrail-webdriver.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          browser = Path(os.environ["TEST_CHROME_BINARY"])
          assert browser.is_file(), browser
          Path(os.environ["WASM_BINDGEN_TEST_WEBDRIVER_JSON"]).write_text(
              json.dumps({"goog:chromeOptions": {"binary": str(browser)}})
          )
          PY

      - name: wasm-bindgen tests (chrome, headless)
        working-directory: dystrail-web
        env:
          WASM_BINDGEN_BENCH_RESULT: ${{ github.workspace }}/target/wbg_benchmark.json
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ runner.temp }}/dystrail-webdriver.json
        run: wasm-pack test --headless --chrome --chromedriver "${{ steps.chrome.outputs.chromedriver-path }}"

  i18n-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Locale coverage tests
        run: |
          cargo test -p dystrail-web --test crossing_i18n_tests -- --nocapture
          cargo test -p dystrail-web i18n_tests -- --nocapture

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install audit/deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: cargo audit
        run: |
          python3 scripts/check_advisory_exceptions.py
          cargo audit --deny warnings

      - name: cargo deny
        run: cargo deny check licenses bans advisories sources

  build:
    runs-on: ubuntu-latest
    needs: [lint, tests, i18n-coverage, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: wasm32-unknown-unknown

      - name: Install pinned Trunk release
        run: |
          curl --fail --location --silent --show-error https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz --output "$RUNNER_TEMP/trunk.tar.gz"
          printf '%s  %s\n' 'f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b' "$RUNNER_TEMP/trunk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP" trunk
          install -m 755 "$RUNNER_TEMP/trunk" "$HOME/.cargo/bin/trunk"
          trunk --version

      - name: Install wasm-opt (binaryen)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Trunk build (release, wasm-opt)
        working-directory: dystrail-web
        env:
          PUBLIC_URL: /play
        run: trunk build --release --public-url /play/

      - name: Upload release dist
        uses: actions/upload-artifact@v4
        with:
          name: dystrail-web-dist
          path: dystrail-web/dist

      - name: Cargo build (workspace release)
        run: cargo build --workspace --release

  qa:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Logic QA sweep
        run: cargo run -p dystrail-tester -- --mode logic --scenarios real-game --iterations 1000 --report console

  tests-e2e-a11y:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the release built by CI
        uses: actions/download-artifact@v4
        with:
          name: dystrail-web-dist
          path: dystrail-web/dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dystrail-web/package-lock.json

      - name: Install dependencies
        working-directory: dystrail-web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: dystrail-web
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: dystrail-web
        env:
          PUBLIC_URL: /play
        run: npx playwright test --reporter=line --trace on

      - name: Upload Playwright artifacts (video/trace)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-a11y-artifacts
          path: |
            dystrail-web/test-results/**
            dystrail-web/playwright-report/**
